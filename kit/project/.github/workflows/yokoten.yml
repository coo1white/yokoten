# yokoten's checks in CI. Make the `ci` job the one required check on main: it waits
# for every other job here and fails if any of them did not succeed. Add your own jobs
# (tests, build) to this file and to the `needs` list of `ci`. Then the ruleset never
# changes when a job is added or renamed.
name: yokoten
on:
  pull_request:
  # A merge queue runs the same checks as a pull request: every job below also runs
  # on a merge group. Turn the queue on in the repo settings.
  merge_group:
  push:
    branches: [main]
# No job gets a permission it does not name.
permissions: {}
# A newer run cancels the one still going for the same pull request or branch. On main,
# the newest run tests everything the older ones would have, so a merge never waits
# behind runs that no longer matter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Which files the pull request changes (#438). It is docs-only when each file is under
  # docs/ or changes/, or is a README.md or CHANGELOG.md outside kit/. Then the jobs that
  # Markdown can't break are skipped. A push to main is a full run, and so is a merge
  # queue group. So is a file list that can't be read: docs_only is true only when the
  # list was read and every file fits.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      # The whole history, so the base commit is there to compare with. A failed checkout
      # does not stop the job: the diff below then fails, and the run is full.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" != pull_request ]; then
            echo "Not a pull request, so every job runs."
          elif [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" --) || [ -z "$files" ]; then
            echo "::warning::The pull request's changed files could not be read, so every job runs."
          else
            docs_only=true
            while IFS= read -r file; do
              case "$file" in
                kit/*) docs_only=false ;;
                docs/*|changes/*|README.md|*/README.md|CHANGELOG.md|*/CHANGELOG.md) ;;
                *) docs_only=false ;;
              esac
            done <<< "$files"
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  # The same check as the commit hook, for commits made without it.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Actions are pinned to a commit, which can't be moved the way a tag can.
      # Dependabot (github-actions) keeps the commit and the version comment current.
      # The whole history, so a translation note can say how many commits it is behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
      - run: node {{cli}} check
  # The workflows themselves: actionlint finds mistakes, zizmor finds security problems.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pinned release, checked against its hash before it runs.
      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      # Findings fail the job as annotations. Nothing is uploaded to code scanning.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
  # Your own jobs go here. To skip one on a docs-only pull request, give it these lines.
  # `!cancelled()` means it still runs if `changes` failed.
  #   needs: changes
  #   if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
  #
  # The one required check. It runs even when a job it needs failed. It goes red if
  # any of them did not succeed (failed, cancelled or skipped). The one exception: on a
  # docs-only pull request, your own jobs may be skipped. `check` and `lint` always run.
  ci:
    if: always()
    needs: [changes, check, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (contains(needs.*.result, 'skipped') && needs.changes.outputs.docs_only != 'true') ||
          needs.changes.result != 'success' || needs.check.result != 'success' ||
          needs.lint.result != 'success'
        run: exit 1
