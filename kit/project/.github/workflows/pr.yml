# The pull request standard: title, tier, sections, linked issue, changelog, milestone,
# labels. Its own workflow, because it must run again when the title, body, labels or
# milestone change, and that should not rerun the tests. Make the `pr` job a required
# check on main, next to the CI check.
name: pr
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, milestoned, demilestoned, ready_for_review]
  # A merge queue runs the required `pr` check too. There is no pull request to check
  # on a merge group run, so the job skips then; a skip counts as green for the queue.
  merge_group:
permissions:
  contents: read
  # check --pr reads the pull request as it is now (#645).
  pull-requests: read
jobs:
  pr:
    # Every run checks the pull request as it is now, read from the API, so the runs may
    # start in any order, and a rerun checks it again. A draft is checked like any pull
    # request. No pull request run is skipped or cancelled: a skip counts as a pass, and a
    # cancelled run shows as a failure on the pull request page (#645).
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, so the check can list the files between base and head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
      # The event file names the pull request and its commits. YOKOTEN_PR_LIVE asks for the
      # title, body, labels and milestone as they are now, read with this token; if that read
      # fails, the check fails. Nothing is pasted into this shell line, and yokoten never
      # prints the token.
      - run: node {{cli}} check --pr
        env:
          YOKOTEN_PR_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
  # One comment per pull request (#615). This job runs the same check with a write
  # token, so a red run edits the old comment instead of adding another, and a clean
  # run removes it. The `pr` job above needs only read access. A pull request from a
  # fork runs no code with a write token: its head may change anything.
  comment:
    needs: pr
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
      - run: node {{cli}} check --pr --comment
        env:
          YOKOTEN_PR_LIVE: '1'
          GITHUB_TOKEN: ${{ github.token }}
