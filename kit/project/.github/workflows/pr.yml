# The pull request standard: title, tier, sections, linked issue, changelog, milestone,
# labels. Its own workflow, because it must run again when the title, body, labels or
# milestone change, and that should not rerun the tests. Make the `pr` job a required
# check on main, next to the CI check.
name: pr
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, milestoned, demilestoned, ready_for_review]
  # A merge queue runs the required `pr` check too. There is no pull request to check
  # on a merge group run, so the job skips then; a skip counts as green for the queue.
  merge_group:
permissions:
  contents: read
jobs:
  pr:
    # A draft skips: the bot opens a pull request as a draft, adds its labels and milestone,
    # then marks it ready, so the check runs once on the whole pull request. No run is
    # cancelled, because a cancelled run shows as a failure on the pull request page (#645).
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history, so the check can list the files between base and head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
      # The title and body are read from the event file, never pasted into this shell line.
      - run: node {{cli}} check --pr
