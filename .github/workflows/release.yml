# Publish yokoten to npm from a release tag (record 0009). Only the owner can create a
# `v*` tag (the tag ruleset), and only the owner can approve the `release` environment.
# npm trusts this file by name (trusted publishing), so it holds no npm token.
name: release
on:
  push:
    tags: ['v*']
# No job gets a permission it does not name.
permissions: {}
# One release at a time, and a release that started is never cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  # Everything that can fail runs here, before the owner is asked to approve.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The whole history, so a translation note can say how many commits it is behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
          # A release never restores a cache another run could have written.
          package-manager-cache: false
      # The tag is read from the environment, never pasted into this shell line.
      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version. Fix: tag v$version, or release a pull request that sets the version first."
            exit 1
          fi
      - run: npm ci
      - run: node --test
      - run: npm run typecheck
      - run: node bin/yokoten.ts check
      # The npm package (record 0008): pack it, install it offline, run install, init and doctor.
      - run: npm run check-package
      # The publish job publishes this exact tarball, so it runs no build and no install.
      - name: Pack the package
        run: |
          mkdir package
          npm pack --pack-destination package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 7
  # Waits for the owner's approval in the `release` environment. npm accepts the OIDC
  # token only from this workflow file in that environment (the trusted publisher).
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^24.22.1'
          # A release never restores a cache another run could have written.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; Node 24 may ship an older one.
      # Pinned to one version, so it is not ad hoc in practice.
      - run: npm install --global npm@11.21.0 # zizmor: ignore[adhoc-packages]
      - name: Publish
        # `./` makes npm read a file: it reads `package/x.tgz` as a GitHub repo and clones it.
        # A release goes to `latest`; a pre-release goes to `next` and never moves `latest` (#632).
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish ./package/*.tgz --provenance --access public --tag "$dist_tag"
