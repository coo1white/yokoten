# Borrowed code is watched (record 0024): once a week, compare each file in
# `src/borrowed/` with upstream's default branch. One issue per source that moved; a
# security fix is called out in the title. It never edits the borrowed code itself.
name: borrowed
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
      - run: node bin/yokoten.ts borrowed
        env:
          GH_TOKEN: ${{ github.token }}
