# All of yokoten's CI in one workflow, so one job, `ci`, can wait for the rest: `needs`
# only reaches jobs in the same workflow. The ruleset on main requires `ci` alone, and
# adding or renaming a job here never changes what it names. The file keeps the kit's
# name, so `init` on this repo finds it and adds no second copy.
name: yokoten
on:
  pull_request:
  # A merge queue runs the same checks as a pull request: every job below also runs
  # on a merge group. Turn the queue on in the repo settings.
  merge_group:
  push:
    branches: [main]
  # The full matrix, macOS shards included, runs on main every day: a pull request
  # runs one macOS job, so the shared runners stay free (#568).
  schedule:
    - cron: '17 5 * * *'
# No job gets a permission it does not name.
permissions: {}
# A newer run cancels the one still going for the same pull request: only its newest
# commit can merge. A push to main never cancels a run: every commit stays in history,
# and a cancelled run leaves a ✗ on it (#660).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Which files the pull request changes (#438). It is docs-only when each file is under
  # docs/ or changes/, or is a README.md or CHANGELOG.md outside kit/. Then the jobs that
  # Markdown can't break are skipped. A push to main is a full run, and so is a merge
  # queue group. So is a file list that can't be read: docs_only is true only when the
  # list was read and every file fits.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      # The whole history, so the base commit is there to compare with. A failed checkout
      # does not stop the job: the diff below then fails, and the run is full.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" != pull_request ]; then
            echo "Not a pull request, so every job runs."
          elif [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ] || ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" --) || [ -z "$files" ]; then
            echo "::warning::The pull request's changed files could not be read, so every job runs."
          else
            docs_only=true
            while IFS= read -r file; do
              case "$file" in
                kit/*) docs_only=false ;;
                docs/*|changes/*|README.md|*/README.md|CHANGELOG.md|*/CHANGELOG.md) ;;
                *) docs_only=false ;;
              esac
            done <<< "$files"
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  # On a docs-only pull request, ubuntu and Node 24 only: the architecture and
  # translation tests read the docs. `!cancelled()`: if `changes` failed, run in full.
  # Each setup runs in three shards, a third of the test files each, so a pull request
  # waits for the slowest third, not the whole suite (#472). `fail-fast: false`: one red
  # shard does not cancel the others, so a run shows every failure at once.
  # macOS is the exception: its runners are few and shared, and three shards on every
  # pull request queued until they timed out (#568). So a pull request runs the whole
  # suite in one macOS job (`of: 1`), and the full three-shard macOS matrix runs on
  # push to main and on the daily schedule.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shard: [1, 2, 3]
        of: [3]
        # The oldest Node yokoten supports (package.json "engines": the first 22 with the
        # security fixes of 2026-10-21, #572), and the current LTS from its first fixed release.
        node: ${{ fromJSON(needs.changes.outputs.docs_only == 'true' && '["^24.22.1"]' || '["22.23.4","^24.22.1"]') }}
        # One macOS run: paths there go through symlinks (/var), which hid a real bug (#1).
        include: ${{ fromJSON(needs.changes.outputs.docs_only == 'true' && '[]' || github.event_name == 'pull_request' && '[{"os":"macos-latest","node":"^24.22.1","shard":1,"of":1}]' || '[{"os":"macos-latest","node":"^24.22.1","shard":1,"of":3},{"os":"macos-latest","node":"^24.22.1","shard":2,"of":3},{"os":"macos-latest","node":"^24.22.1","shard":3,"of":3}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Four files at a time (Node's default is the CPU count minus one), and one compile
      # cache for every child node, so each test file strips its TypeScript once (#442).
      # The spec reporter on every Node, so the logs read alike (Node 22 defaults to TAP).
      # A TAP copy of the report goes to a file, for the time check below.
      - run: node --test --test-concurrency=4 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=${{ runner.temp }}/tests.tap --test-shard=${{ matrix.shard }}/${{ matrix.of }}
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
      # The time and the slowest tests go in the job summary. It fails far above the slowest run
      # seen: 180 s a shard, or 90 s on Node 24 on Linux, the fastest setup (#475). The one
      # whole-suite macOS job gets 300 s: its slowest run seen took 191 s (record 0016).
      - run: node scripts/time/suite.ts ${{ runner.temp }}/tests.tap ${{ matrix.of == 1 && '--budget 300' || matrix.os == 'ubuntu-latest' && matrix.node == '24' && '--budget 90' || '' }}
  # Types are checked here and nowhere else: Node runs the .ts files without them.
  # Skipped on a docs-only pull request.
  typecheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
      - run: npm ci
      - run: npm run typecheck
      # The npm package (record 0008): pack it, install it offline, run install, init and doctor.
      - run: npm run check-package
  # The same check as the commit hook, for commits made without it.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so a translation note can say how many commits it is behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '^22.23.4'
      - run: node bin/yokoten.ts check
  # The workflows themselves: actionlint for mistakes, zizmor for security. These are
  # CI tools only, never a dependency of yokoten.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pinned release, checked against its hash before it runs.
      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          # The kit's workflow is linted as `init` writes it: the {{cli}} placeholder filled in.
          mkdir -p "$RUNNER_TEMP/kit"
          for f in kit/project/.github/workflows/*.yml; do
            sed "s|{{cli}}|.yokoten/bin/yokoten.ts|g" "$f" > "$RUNNER_TEMP/kit/$(basename "$f")"
          done
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml "$RUNNER_TEMP"/kit/*.yml
      # Findings fail the job here, as annotations; no upload to code scanning.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
  # The action other repos use (action.yml, #106), run here as they would run it. No
  # `check --pr`: this workflow does not run again when the title or labels change, so a
  # fixed title would leave `ci` red. The `pr` workflow checks the pull request.
  # Skipped on a docs-only pull request.
  action:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # GitHub documents `$/` only with a folder after it, not for an action at the root.
      - uses: ./ # zizmor: ignore[self-repository]
        with:
          pr-check: false
  # The one required check. It runs even when a job it needs failed, and goes red if
  # any of them did not succeed (failed, cancelled or skipped). The one exception: on a
  # docs-only pull request, `typecheck` and `action` are skipped on purpose (#438).
  # A job that never started is named in the summary, so a queued timeout reads as
  # "no runner was free", not as a test failure (#568).
  ci:
    if: always()
    needs: [changes, test, typecheck, check, lint, action]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      # A job that timed out or was cancelled before any step started never got a
      # runner: the shared macOS runners were busy. Diagnosis only: it never fails
      # this job, so a broken query cannot turn a green run red.
      - if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          starved=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '[.jobs[] | select((.conclusion == "timed_out" or .conclusion == "cancelled") and ([.steps[]? | select(.started_at != null)] | length == 0)) | .name] | unique | join(", ")')
          if [ -n "$starved" ]; then
            echo "::warning::These jobs never started: no runner was free, or they were cancelled while queued. Not test failures: $starved"
            echo "These jobs never started, so this is not a test failure (no runner was free, or they were cancelled while queued): $starved" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (contains(needs.*.result, 'skipped') && needs.changes.outputs.docs_only != 'true') ||
          needs.changes.result != 'success' || needs.test.result != 'success' ||
          needs.check.result != 'success' || needs.lint.result != 'success'
        run: exit 1
