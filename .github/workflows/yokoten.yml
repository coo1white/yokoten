# All of yokoten's CI in one workflow, so one job, `ci`, can wait for the rest: `needs`
# only reaches jobs in the same workflow. The ruleset on main requires `ci` alone, and
# adding or renaming a job here never changes what it names. The file keeps the kit's
# name, so `init` on this repo finds it and adds no second copy.
name: yokoten
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A new push to a pull request cancels the run still going for it. Every other run
# (a push to main) gets a group of its own, so nothing on main is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Node that runs .ts as it is (package.json "engines"), and the current 22.
        node: ['22.18.0', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
  # Types are checked here and nowhere else: Node runs the .ts files without them.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
  # The same check as the commit hook, for commits made without it.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node bin/yokoten.ts check
  # The workflows themselves: actionlint for mistakes, zizmor for security. These are
  # CI tools only, never a dependency of yokoten.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pinned release, checked against its hash before it runs.
      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          # The kit's workflow is linted as `init` writes it: the {{cli}} placeholder filled in.
          mkdir -p "$RUNNER_TEMP/kit"
          for f in kit/project/.github/workflows/*.yml; do
            sed "s|{{cli}}|.yokoten/bin/yokoten.ts|g" "$f" > "$RUNNER_TEMP/kit/$(basename "$f")"
          done
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml "$RUNNER_TEMP"/kit/*.yml
      # Findings fail the job here, as annotations; no upload to code scanning.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
  # The one required check. It runs even when a job it needs failed, and goes red if
  # any of them did not succeed (failed, cancelled or skipped).
  ci:
    if: always()
    needs: [test, typecheck, check, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
