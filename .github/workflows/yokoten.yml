# The same check as the commit hook, for commits made without it. Make this job a
# required check on main.
name: yokoten
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node bin/yokoten.ts check
