# Monthly, one grouped pull request per kind, so updates don't each cost a review
# (core rule 8). yokoten has no runtime dependencies: these are the type checker and
# the actions CI runs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
    labels: [ci]
    ignore:
      # @types/node follows the Node floor (22), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: [ci]
